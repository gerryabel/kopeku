services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/kopeku
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kopeku
      DB_USERNAME: kopeku
      DB_PASSWORD: kopeku_pass
    volumes:
      - ..:/workspaces/kopeku:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kopeku_root
      MYSQL_DATABASE: kopeku
      MYSQL_USER: kopeku
      MYSQL_PASSWORD: kopeku_pass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pkopeku_root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data: